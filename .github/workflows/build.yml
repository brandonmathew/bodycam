name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'bodycam/**'
      - 'bodycam.slnx'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: msbuild bodycam\bodycam.vcxproj /m /p:Configuration=Release /p:Platform=x64

      - name: Find the DLL
        id: dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter bodycam.dll | Select-Object -First 1
          if (-not $dll) { throw "bodycam.dll not found after build" }
          "path=$($dll.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "Built: $($dll.FullName)"

      - name: Publish rolling latest release (main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          files: ${{ steps.dll.outputs.path }}

      - name: Publish versioned release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.dll.outputs.path }}
